{% extends 'myapp/layout/base.html' %}
{% load static %}

{% block title %}
    Forget Password
{% endblock title %}

{% block extra_css %}
<style>
.forgot-password-div {
    width: 90%;
    max-width: 400px;
    background: white;
    margin: 100px auto;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
    text-align: center;
    background: linear-gradient(360deg, #6B8E23, #FFD700);
}
.form-container {
    display: none;
    animation: fadeIn 0.3s ease-in-out;
}
.form-container.active {
    display: block;
}
input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 16px;
}
button {
    width: 100%;
    padding: 10px;
    background: #007bff;
    border: none;
    color: white;
    font-size: 16px;
    cursor: pointer;
    border-radius: 5px;
    margin-top: 10px;
}

button:hover {
    background: #0056b3;
}

.error {
    color: red;
    font-size: 14px;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 600px) {
    .forgot-password-div {
        width: 95%;
        padding: 15px;
    }

    input, button {
        font-size: 14px;
    }
}

</style>
{% endblock extra_css %}

{% block content %}

<div class="forgot-password-div">
    <h2>Forgot Password</h2>
    
    <!-- Step 1: Enter Email -->
    <div id="email-step" class="form-container active">
        <p class="error" id="email-error"></p>
        <input type="email" id="email" placeholder="Enter your email" required>
        <button id="send-otp">Send OTP</button>
    </div>

    <!-- Step 2: Enter OTP -->
    <div id="otp-step" class="form-container">
        <p class="error" id="otp-error"></p>
        <input type="text" id="otp" placeholder="Enter OTP" required>
        <button id="verify-otp">Verify OTP</button>
    </div>

    <!-- Step 3: Reset Password -->
    <div id="reset-password-step" class="form-container">
        <p class="error" id="reset-error"></p>
        <input type="password" id="new-password" placeholder="New Password" required>
        <button id="reset-password">Reset Password</button>
    </div>
</div>
{% endblock content %}

{% block script %}
<script>
   document.addEventListener("DOMContentLoaded", function () {
    // Step 1: Send OTP
    document.getElementById("send-otp").addEventListener("click", function (event) {
        event.preventDefault(); // Prevent default form submission

        var email = document.getElementById("email").value.trim();
        var emailError = document.getElementById("email-error");

        if (!email) {
            emailError.textContent = "Email cannot be empty.";
            return;
        }

        emailError.textContent = ""; // Clear previous errors

        fetch("{% url 'forgot_password' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                "X-CSRFToken": "{{ csrf_token }}"
            },
            body: new URLSearchParams({ email: email })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === "success") {
                alert("OTP sent successfully! Check your email.");
                document.getElementById("email-step").classList.remove("active");
                document.getElementById("otp-step").classList.add("active");
            } else {
                emailError.textContent = data.error;
            }
        })
        .catch(error => {
            console.error("Error:", error);
            emailError.textContent = "An error occurred. Try again.";
        });
    });

    // Step 2: Verify OTP
    document.getElementById("verify-otp").addEventListener("click", function (event) {
        event.preventDefault();

        var otp = document.getElementById("otp").value.trim();
        var otpError = document.getElementById("otp-error");

        if (!otp) {
            otpError.textContent = "OTP cannot be empty.";
            return;
        }

        otpError.textContent = "";

        fetch("{% url 'verify_otp' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                "X-CSRFToken": "{{ csrf_token }}"
            },
            body: new URLSearchParams({ otp: otp })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === "success") {
                document.getElementById("otp-step").classList.remove("active");
                document.getElementById("reset-password-step").classList.add("active");
            } else {
                otpError.textContent = data.error;
            }
        })
        .catch(error => {
            console.error("Error:", error);
            otpError.textContent = "An error occurred. Try again.";
        });
    });

    // Step 3: Reset Password
    document.getElementById("reset-password").addEventListener("click", function (event) {
        event.preventDefault();

        var password = document.getElementById("new-password").value.trim();
        var resetError = document.getElementById("reset-error");

        if (!password) {
            resetError.textContent = "Password cannot be empty.";
            return;
        }

        resetError.textContent = "";

        fetch("{% url 'reset_password' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                "X-CSRFToken": "{{ csrf_token }}"
            },
            body: new URLSearchParams({ password: password })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === "success") {
                alert("Password Reset Successfully! Redirecting to Login.");
                window.location.href = "{% url 'login' %}";
            } else {
                resetError.textContent = data.error;
            }
        })
        .catch(error => {
            console.error("Error:", error);
            resetError.textContent = "An error occurred. Try again.";
        });
    });
});


    
</script>
{% endblock script %}
